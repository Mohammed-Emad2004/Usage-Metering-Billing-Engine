name: flyrank-metering-billing
version: 0.1.0

run: uvicorn app.main:app --host 0.0.0.0 --port 8000
seed: python app/db/seed.py
test: pytest
demo: python -m demo.run_demo

base_url: http://localhost:8000

endpoints:
  - path: /health
    method: GET
    expected_status: 200
  - path: /
    method: GET
    expected_status: 200
